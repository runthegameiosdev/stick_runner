
name: Build iOS

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7 Xcode project
        run: |
          set -e
          wget -O archive.zip "https://www.dropbox.com/scl/fi/jrs6e100a1mb41fpnwrp6/iosbuildd.zip?rlkey=49d354o3a0r5zq0mqbtlhk4lr&st=hbw1miwx&dl=1"
          unzip archive.zip -d exported

      - name: Find Xcode project
        id: project
        run: |
          set -e
          PROJECT="$(find exported -type d -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found in the Dropbox ZIP."
            find exported -maxdepth 4 -print
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Show Xcode schemes
        run: |
          xcodebuild -list -project "${{ steps.project.outputs.path }}"

      - name: Build and archive iOS app
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.path }}"

          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not find an Xcode scheme."
            exit 1
          fi

          echo "Building scheme: $SCHEME"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Game.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          set -e

          APP_PATH="$(find "$RUNNER_TEMP/Game.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced by the archive."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr Game.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-IPA
          path: ${{ runner.temp }}/Game.ipa
          retention-days: 3
