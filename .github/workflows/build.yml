name: "Build iOS app"

on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract Xcode project
        run: |
          wget -O archive.zip "YOUR_EXISTING_DROPBOX_DOWNLOAD_URL"
          unzip archive.zip -d .

      - name: Build archive and create IPA
        run: |
          set -e

          PROJECT="$(find . -type d -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found after extraction."
            find . -maxdepth 4 -type d -print
            exit 1
          fi

          echo "Found Xcode project: $PROJECT"

          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            xcodebuild -list -project "$PROJECT"
            exit 1
          fi

          echo "Using scheme: $SCHEME"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          APP_PATH="$(find "$RUNNER_TEMP/build.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was found in the archive."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -r run.ipa Payload

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: run
          path: ${{ runner.temp }}/run.ipa
          retention-days: 3
