
name: "Build iOS app"

on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exported Xcode project
        run: |
          set -e
          wget -O archive.zip "https://www.dropbox.com/scl/fi/jrs6e100a1mb41fpnwrp6/iosbuildd.zip?rlkey=49d354o3a0r5zq0mqbtlhk4lr&st=hbw1miwx&dl=1"
          unzip archive.zip -d .

      - name: Build IPA
        run: |
          set -e

          PROJECT="$(find . -type d -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found in the downloaded ZIP."
            find . -maxdepth 4 -print
            exit 1
          fi

          echo "Project: $PROJECT"
          xcodebuild -list -project "$PROJECT"

          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            exit 1
          fi

          echo "Scheme: $SCHEME"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="$(find "$RUNNER_TEMP/build.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No app found in the Xcode archive."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr run.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: run
          path: ${{ runner.temp }}/run.ipa
          retention-days: 3
